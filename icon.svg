<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Billete de dinero estilizado -->
  <rect width="512" height="512" fill="#0066cc"/>
  
  <!-- Billete -->
  <rect x="80" y="150" width="352" height="212" fill="#1a75ff" stroke="#fff" stroke-width="3"/>
  
  <!-- Símbolo de dinero $ -->
  <circle cx="256" cy="256" r="60" fill="#ffd700" stroke="#fff" stroke-width="2"/>
